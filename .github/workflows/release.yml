name: Release

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from pyproject.toml, without the leading v (for example, 0.1.0)
        required: true
        type: string
      publish:
        description: Create or resume the immutable tag and GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dwell-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dispatch_sha: ${{ steps.release.outputs.dispatch_sha }}
      mode: ${{ steps.release.outputs.mode }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      DISPATCH_REF: ${{ github.ref }}
      HF_HUB_OFFLINE: "1"
      RELEASE_VERSION: ${{ inputs.version }}
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve and verify release request
        id: release
        shell: bash
        run: |
          set -euo pipefail

          test "$DISPATCH_REF" = "refs/heads/main" || {
            echo "Run this workflow from the main branch." >&2
            exit 1
          }

          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          }

          dispatch_sha=$(git rev-parse HEAD)
          test "$dispatch_sha" = "$GITHUB_SHA"
          release_tag="v$RELEASE_VERSION"
          tag_ref="refs/tags/$release_tag"

          if git show-ref --verify --quiet "$tag_ref"; then
            test "$(git cat-file -t "$tag_ref")" = "tag" || {
              echo "Existing $release_tag is not an annotated release tag." >&2
              exit 1
            }
            release_sha=$(git rev-list -n 1 "$tag_ref")
            git merge-base --is-ancestor "$release_sha" "$dispatch_sha" || {
              echo "Existing $release_tag is not in the selected main history." >&2
              exit 1
            }
            mode="resume"
          else
            release_sha="$dispatch_sha"
            mode="new"
          fi

          project_version=$(git show "$release_sha:pyproject.toml" \
            | sed -n 's/^version = "\([^"]*\)"/\1/p' \
            | head -n 1)
          test -n "$project_version"
          test "$RELEASE_VERSION" = "$project_version" || {
            echo "Requested version $RELEASE_VERSION does not match release source ($project_version)." >&2
            exit 1
          }

          source_date_epoch=$(git show -s --format=%ct "$release_sha")
          test -n "$source_date_epoch"

          echo "RELEASE_MODE=$mode" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "dispatch_sha=$dispatch_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          git checkout --detach "$release_sha"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11.15"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --all-groups

      - name: Verify lockfile
        run: uv lock --check

      - name: Lint
        run: |
          UV_OFFLINE=1 uv run ruff check .
          UV_OFFLINE=1 uv run ruff format --check src tests

      - name: Test
        run: UV_OFFLINE=1 uv run pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1

          smoke_venv="$RUNNER_TEMP/dwell-release-smoke"
          smoke_home="$RUNNER_TEMP/dwell-home"
          uv venv "$smoke_venv" --python 3.11.15
          uv pip install --python "$smoke_venv/bin/python" "${wheels[0]}"

          DWELL_HOME="$smoke_home" "$smoke_venv/bin/dwell" --version \
            | grep -F "Dwell $RELEASE_VERSION"
          DWELL_HOME="$smoke_home" "$smoke_venv/bin/dwell" config show | grep -F "$smoke_home"
          DWELL_HOME="$smoke_home" "$smoke_venv/bin/dwell" models list \
            | grep -F "ltx-2.5-bf16"
          DWELL_HOME="$smoke_home" "$smoke_venv/bin/dwell" models list \
            | grep -F "qwen3-coder-30b-a3b-4bit"

      - name: Prepare installer release assets
        shell: bash
        run: |
          set -euo pipefail

          requirements="requirements-macos-arm64-py311.txt"
          uv export \
            --format requirements-txt \
            --locked \
            --no-dev \
            --no-emit-project \
            --no-sources \
            --output-file "dist/$requirements"

          grep -E '^mlx-lm==0\.31\.3 ' "dist/$requirements" \
            | grep -F "platform_machine == 'arm64'" \
            | grep -F "sys_platform == 'darwin'"
          ! grep -E '^(dwell-ai|pytest(-asyncio)?|ruff)==' "dist/$requirements"

          # uv treats --no-build and --only-binary :all: as mutually exclusive;
          # the latter provides the stronger wheel-only validation.
          MACOSX_DEPLOYMENT_TARGET=14.0 uv --no-config pip sync \
            "dist/$requirements" \
            --target "$RUNNER_TEMP/dwell-requirements-check" \
            --python-version 3.11.15 \
            --python-platform aarch64-apple-darwin \
            --require-hashes \
            --only-binary :all: \
            --strict \
            --dry-run

          test -f install.sh
          test -x install.sh
          /bin/sh -n install.sh
          grep -F "requirements-macos-arm64-py311.txt" install.sh
          grep -F "SHA256SUMS" install.sh
          cp install.sh dist/install.sh
          chmod 0755 dist/install.sh

          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1

          release_inputs=(
            "$(basename "${wheels[0]}")"
            "$(basename "${sdists[0]}")"
            "$requirements"
            "install.sh"
          )
          mapfile -t dist_files < <(find dist -maxdepth 1 -type f -print | sort)
          test "${#dist_files[@]}" -eq "${#release_inputs[@]}"

          (
            cd dist
            sha256sum "${release_inputs[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Save validated release assets
        if: inputs.publish
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dwell-release-${{ inputs.version }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          path: dist/

      - name: Summarize validation-only run
        if: ${{ !inputs.publish }}
        run: |
          echo "Release $RELEASE_TAG passed lock, test, package, and installer validation."
          echo "Nothing was pushed because publish was not selected."

  publish:
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DISPATCH_SHA: ${{ needs.validate.outputs.dispatch_sha }}
      RELEASE_MODE: ${{ needs.validate.outputs.mode }}
      RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}

    steps:
      - name: Check out the verified main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.dispatch_sha }}

      - name: Download validated release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: dwell-release-${{ inputs.version }}
          path: ${{ runner.temp }}/dwell-release

      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/dwell-release"
          requirements="$release_dir/requirements-macos-arm64-py311.txt"
          shopt -s nullglob
          wheels=("$release_dir"/*.whl)
          sdists=("$release_dir"/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test -f "$requirements"
          test -f "$release_dir/install.sh"
          test -f "$release_dir/SHA256SUMS"

          expected_payloads=(
            "$(basename "${wheels[0]}")"
            "$(basename "${sdists[0]}")"
            "$(basename "$requirements")"
            "install.sh"
          )
          expected_files=(
            "${wheels[0]}"
            "${sdists[0]}"
            "$requirements"
            "$release_dir/install.sh"
            "$release_dir/SHA256SUMS"
          )
          mapfile -t actual_files < <(find "$release_dir" -maxdepth 1 -type f -print | sort)
          test "${#actual_files[@]}" -eq "${#expected_files[@]}"
          test "$(printf '%s\n' "${actual_files[@]}")" = \
            "$(printf '%s\n' "${expected_files[@]}" | sort)"

          mapfile -t checksum_names < <(awk '{ print $2 }' "$release_dir/SHA256SUMS" | sort)
          test "$(printf '%s\n' "${checksum_names[@]}")" = \
            "$(printf '%s\n' "${expected_payloads[@]}" | sort)"
          (cd "$release_dir" && sha256sum --check SHA256SUMS)

      - name: Publish or verify immutable release tag
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          remote_main=$(git rev-parse refs/remotes/origin/main)
          git merge-base --is-ancestor "$RELEASE_SHA" "$DISPATCH_SHA" || {
            echo "The release commit is not in the selected main history." >&2
            exit 1
          }
          git merge-base --is-ancestor "$DISPATCH_SHA" "$remote_main" || {
            echo "The selected release commit is no longer in main history." >&2
            exit 1
          }

          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs=$(git ls-remote --tags origin "$tag_ref" "$tag_ref^{}")
          remote_tag=$(printf '%s\n' "$remote_refs" \
            | awk -v ref="$tag_ref" '$2 == ref { print $1 }')
          remote_revision=$(printf '%s\n' "$remote_refs" \
            | awk -v ref="$tag_ref^{}" '$2 == ref { print $1 }')

          if test -z "$remote_tag"; then
            test "$RELEASE_MODE" = "new" || {
              echo "The existing $RELEASE_TAG disappeared after validation." >&2
              exit 1
            }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Dwell $RELEASE_TAG"
            if ! git push origin "$tag_ref:$tag_ref"; then
              echo "Tag push raced with another publisher; verifying the remote tag."
            fi

            remote_refs=$(git ls-remote --tags origin "$tag_ref" "$tag_ref^{}")
            remote_tag=$(printf '%s\n' "$remote_refs" \
              | awk -v ref="$tag_ref" '$2 == ref { print $1 }')
            remote_revision=$(printf '%s\n' "$remote_refs" \
              | awk -v ref="$tag_ref^{}" '$2 == ref { print $1 }')
          fi

          test -n "$remote_tag" || {
            echo "Remote tag $RELEASE_TAG was not created." >&2
            exit 1
          }
          test -n "$remote_revision" || {
            echo "Remote $RELEASE_TAG is not an annotated tag." >&2
            exit 1
          }
          test "$remote_revision" = "$RELEASE_SHA" || {
            echo "Remote $RELEASE_TAG points to a different commit." >&2
            exit 1
          }

      - name: Publish, resume, or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/dwell-release"
          mapfile -t release_assets < <(find "$release_dir" -maxdepth 1 -type f -print | sort)
          test "${#release_assets[@]}" -eq 5

          expected_names="$RUNNER_TEMP/expected-release-assets.txt"
          printf '%s\n' "${release_assets[@]##*/}" | sort > "$expected_names"
          release_json="$RUNNER_TEMP/release.json"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Dwell $RELEASE_TAG"
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_json"
          is_draft=$(jq -r '.draft' "$release_json")
          if test "$is_draft" = "true"; then
            expected_names_json=$(jq -R -s \
              'split("\n") | map(select(length > 0))' "$expected_names")
            mapfile -t unexpected_asset_ids < <(
              jq -r --argjson expected "$expected_names_json" \
                '.assets[] | select(.name as $name | ($expected | index($name)) == null) | .id' \
                "$release_json"
            )

            for asset_id in "${unexpected_asset_ids[@]}"; do
              [[ "$asset_id" =~ ^[0-9]+$ ]] || {
                echo "GitHub returned an invalid release asset ID: $asset_id" >&2
                exit 1
              }
              current_is_draft=$(gh api \
                "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')
              test "$current_is_draft" = "true" || {
                echo "Release was published while its draft assets were being repaired; refusing to mutate it." >&2
                exit 1
              }
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done

            current_is_draft=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')
            test "$current_is_draft" = "true" || {
              echo "Release was published before its draft assets could be uploaded; refusing to mutate it." >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
          fi

          verify_release_assets() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_json" \
              || return 1
            jq -r '.assets[].name' "$release_json" | sort > "$RUNNER_TEMP/actual-release-assets.txt"
            cmp "$expected_names" "$RUNNER_TEMP/actual-release-assets.txt" || return 1

            for artifact in "${release_assets[@]}"; do
              asset_name=$(basename "$artifact")
              expected_digest="sha256:$(sha256sum "$artifact" | awk '{ print $1 }')"
              actual_digest=$(jq -r --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | .digest' "$release_json")
              test "$actual_digest" = "$expected_digest" || return 1
            done
          }

          assets_verified="false"
          for attempt in 1 2 3 4 5; do
            if verify_release_assets; then
              assets_verified="true"
              break
            fi
            test "$attempt" -eq 5 || sleep 2
          done
          test "$assets_verified" = "true" || {
            echo "GitHub Release assets are missing, unexpected, or have the wrong digest." >&2
            exit 1
          }

          if test "$is_draft" = "true"; then
            current_is_draft=$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')
            if test "$current_is_draft" = "true"; then
              gh release edit "$RELEASE_TAG" --draft=false --title "Dwell $RELEASE_TAG"
            fi
          fi

          release_url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          echo "Published or verified $RELEASE_TAG from $RELEASE_SHA: $release_url"
