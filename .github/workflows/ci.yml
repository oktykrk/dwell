name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Validate installer contract
        shell: bash
        run: |
          set -euo pipefail

          test -x install.sh
          /bin/sh -n install.sh
          grep -F "requirements-macos-arm64-py311.txt" install.sh
          grep -F "SHA256SUMS" install.sh

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11.15"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --all-groups

      - name: Verify lockfile
        run: uv lock --check

      - name: Lint
        run: |
          UV_OFFLINE=1 uv run ruff check .
          UV_OFFLINE=1 uv run ruff format --check src tests

      - name: Test
        run: UV_OFFLINE=1 uv run pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke test installed wheel
        shell: bash
        run: |
          smoke_venv="$RUNNER_TEMP/dwell-wheel-smoke"
          smoke_home="$RUNNER_TEMP/dwell-home"
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

          uv venv "$smoke_venv" --python 3.11.15
          uv pip install --python "$smoke_venv/bin/python" "$wheel"

          DWELL_HOME="$smoke_home" "$smoke_venv/bin/dwell" --version
          DWELL_HOME="$smoke_home" "$smoke_venv/bin/dwell" config show | grep -F "$smoke_home"
          DWELL_HOME="$smoke_home" "$smoke_venv/bin/dwell" models list | grep -F "ltx-2.5-bf16"
          DWELL_HOME="$smoke_home" "$smoke_venv/bin/dwell" models list \
            | grep -F "qwen3-coder-30b-a3b-4bit"
          "$smoke_venv/bin/python" -c \
            "import importlib.metadata; import mlx_lm.server; assert importlib.metadata.version('mlx-lm') == '0.31.3'"
