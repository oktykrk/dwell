[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "dwell-ai"
version = "0.1.0"
description = "A local AI gateway and inference lifecycle manager for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dwell contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.27,<2",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
dwell = "dwell.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dwell"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
